services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: three-tier-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MONGO_URI=mongodb://mongo:27017/three-tier-app
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRY=7d
      - LOG_LEVEL=info
      - LOG_DIR=/app/logs
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - app-logs:/app/logs
    networks:
      - app-network

  mongo:
    image: mongo:7
    container_name: three-tier-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=three-tier-app
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app-network

  mongo-express:
    image: mongo-express:1.0
    container_name: three-tier-mongo-express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_URL=mongodb://mongo:27017/
      - ME_CONFIG_MONGODB_ADMINUSERNAME=
      - ME_CONFIG_MONGODB_ADMINPASSWORD=
      - ME_CONFIG_BASICAUTH=false
    depends_on:
      - mongo
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://app:3000/api
    container_name: three-tier-frontend
    restart: unless-stopped
    ports:
      - "3002:3001"
    environment:
      - NODE_ENV=production
    depends_on:
      - app
    networks:
      - app-network

volumes:
  mongo-data:
    driver: local
  app-logs:
    driver: local

networks:
  app-network:
    driver: bridge
